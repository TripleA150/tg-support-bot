services:
    app:
        build: .
        container_name: pet
        restart: always
        depends_on:
#            - pgdb
        env_file:
            - .env
        working_dir: /var/www/
        volumes:
            - .:/var/www
        networks:
            - pet
        dns:
            - 8.8.8.8
            - 1.1.1.1
        extra_hosts:
            - "host.docker.internal:host-gateway"

#    pgdb:
#        container_name: pgdb
#        image: postgres
#        tty: true
#        restart: always
#        environment:
#            - POSTGRES_DB=${DB_DATABASE}
#            - POSTGRES_USER=${DB_USERNAME}
#            - POSTGRES_PASSWORD=${DB_PASSWORD}
#        ports:
#            - ${PGDB_PORT}
#        volumes:
#            - pgdata:/var/lib/postgresql
#        networks:
#            - pet

    nginx:
        image: nginx:latest
        container_name: nginx
        restart: unless-stopped
        ports:
            - ${NGINX_PORT}
#            - "443:443"
        volumes:
            - .:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
            - /etc/nginx/site_certs:/etc/letsencrypt:ro
            - ./docker/nginx/logs:/var/log/nginx
        environment:
            - TZ=${SYSTEM_TIMEZONE}
        depends_on:
#            - pgdb
            - app
        networks:
            - pet

    queue:
        build: .
        container_name: laravel_queue
        restart: always
        depends_on:
            - app
        env_file:
            - .env
        environment:
            - CONTAINER_ROLE=worker
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
        networks:
            - pet
        dns:
            - 8.8.8.8
            - 1.1.1.1
        extra_hosts:
            - "host.docker.internal:host-gateway"

    scheduler:
        build: .
        container_name: laravel_scheduler
        restart: always
        depends_on:
            - app
        env_file:
            - .env
        environment:
            - CONTAINER_ROLE=worker
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: php artisan schedule:work
        networks:
            - pet
        dns:
            - 8.8.8.8
            - 1.1.1.1

volumes:
    pgdata:
networks:
    pet:
        driver: bridge
